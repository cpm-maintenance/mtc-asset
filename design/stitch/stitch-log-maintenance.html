<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Subterranean Command - Maintenance Log</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e5e2e1",
                        "inverse-primary": "#705d00",
                        "error": "#ffb4ab",
                        "outline": "#999077",
                        "surface-tint": "#e9c400",
                        "surface-container-low": "#1c1b1b",
                        "tertiary": "#fff5e7",
                        "on-primary": "#3a3000",
                        "on-secondary-fixed": "#1c1b1b",
                        "secondary": "#c8c6c5",
                        "primary-fixed": "#ffe16d",
                        "surface-bright": "#393939",
                        "tertiary-container": "#ffd477",
                        "on-secondary-fixed-variant": "#474746",
                        "primary": "#fff6df",
                        "inverse-on-surface": "#313030",
                        "on-background": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "error-container": "#93000a",
                        "surface": "#131313",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#2a2a2a",
                        "outline-variant": "#4d4732",
                        "on-tertiary-container": "#795a00",
                        "background": "#131313",
                        "tertiary-fixed": "#ffdf9e",
                        "on-surface": "#e5e2e1",
                        "surface-container": "#201f1f",
                        "on-primary-container": "#705e00",
                        "on-primary-fixed-variant": "#544600",
                        "on-tertiary": "#3f2e00",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-primary-fixed": "#221b00",
                        "surface-variant": "#353534",
                        "surface-dim": "#131313",
                        "tertiary-fixed-dim": "#fabd00",
                        "secondary-container": "#474746",
                        "on-tertiary-fixed": "#261a00",
                        "on-tertiary-fixed-variant": "#5b4300",
                        "inverse-surface": "#e5e2e1",
                        "on-secondary-container": "#b7b5b4",
                        "primary-container": "#ffd700",
                        "primary-fixed-dim": "#e9c400",
                        "on-surface-variant": "#d0c6ab",
                        "on-secondary": "#313030",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #131313;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex justify-between items-center px-6 h-16 bg-[#131313]/80 backdrop-blur-xl z-50 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#FFD700]">menu</span>
<h1 class="text-xl font-black text-[#FFD700] tracking-widest font-['Space_Grotesk'] uppercase">SUBTERRANEAN COMMAND</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#FFD700]">qr_code_scanner</span>
</div>
</header>
<main class="pt-24 px-4 max-w-4xl mx-auto">
<div class="mb-8">
<h2 class="font-headline text-3xl font-bold text-on-surface tracking-tighter uppercase mb-2">MAINTENANCE LOG</h2>
<p class="font-body text-on-surface-variant text-sm tracking-wide">SHIFT ID: SUB-772-ALPHA | DATE: 24.OCT.2023</p>
</div>
<section class="space-y-6">
<!-- Technician and HM Entry -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-widest">Technician Name</label>
<div class="bg-surface-container-lowest p-4 border-b-4 border-outline-variant/20 focus-within:border-primary-container transition-all">
<input class="bg-transparent w-full text-primary font-medium placeholder:text-surface-container-highest" placeholder="ENTER ID OR NAME" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-widest">HM Entry (Hours)</label>
<div class="bg-surface-container-lowest p-4 border-b-4 border-outline-variant/20 focus-within:border-primary-container transition-all">
<input class="bg-transparent w-full text-primary font-medium placeholder:text-surface-container-highest" placeholder="00000.0" type="number"/>
</div>
<div class="flex items-center gap-2 mt-1 px-2 py-1 bg-error-container/20 text-error text-[10px] font-bold uppercase tracking-tighter">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">warning</span>
<span>Entry must be higher than previous: 12,450.2</span>
</div>
</div>
</div>
<!-- Status Toggle -->
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-widest">Unit Operational Status</label>
<div class="grid grid-cols-2 h-24">
<button class="bg-primary-container text-on-primary flex flex-col items-center justify-center gap-1 group active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline font-bold text-lg tracking-widest">READY</span>
</button>
<button class="bg-surface-container-high text-on-surface-variant flex flex-col items-center justify-center gap-1 group opacity-60 hover:opacity-100 hover:bg-error-container hover:text-white transition-all">
<span class="material-symbols-outlined text-3xl">dangerous</span>
<span class="font-headline font-bold text-lg tracking-widest">BREAKDOWN</span>
</button>
</div>
</div>
<!-- Dynamic Sparepart Input Section -->
<div class="bg-surface-container-low p-6 space-y-4">
<div class="flex justify-between items-end border-b border-outline-variant/10 pb-4">
<h3 class="font-headline text-xl font-bold text-primary tracking-tighter">SPAREPART UTILIZATION</h3>
<button class="bg-surface-container-highest px-4 py-2 flex items-center gap-2 hover:bg-primary-container hover:text-on-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-sm">add</span>
<span class="font-label text-xs font-bold uppercase tracking-widest">+ Add Sparepart</span>
</button>
</div>
<!-- Dynamic Row 1 -->
<div class="grid grid-cols-12 gap-1 items-stretch">
<div class="col-span-8 bg-surface-container-lowest p-4">
<label class="block text-[10px] text-on-surface-variant mb-1 font-bold">COMPONENT</label>
<select class="bg-transparent w-full text-on-surface font-medium border-none appearance-none cursor-pointer">
<option>HYDRAULIC FILTER - XJ900</option>
<option>BRAKE PAD SET - INDUSTRIAL</option>
<option>TRANSMISSION FLUID 20L</option>
</select>
</div>
<div class="col-span-3 bg-surface-container-lowest p-4 text-center">
<label class="block text-[10px] text-on-surface-variant mb-1 font-bold">QTY</label>
<div class="flex items-center justify-center gap-4">
<button class="material-symbols-outlined text-outline hover:text-primary transition-colors">remove</button>
<span class="font-headline font-bold text-lg">02</span>
<button class="material-symbols-outlined text-outline hover:text-primary transition-colors">add</button>
</div>
</div>
<button class="col-span-1 bg-surface-container-high flex items-center justify-center text-error/60 hover:text-error hover:bg-error-container/20 transition-all">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Dynamic Row 2 -->
<div class="grid grid-cols-12 gap-1 items-stretch">
<div class="col-span-8 bg-surface-container-lowest p-4">
<label class="block text-[10px] text-on-surface-variant mb-1 font-bold">COMPONENT</label>
<select class="bg-transparent w-full text-on-surface font-medium border-none appearance-none cursor-pointer">
<option>O-RING SEAL KIT (34MM)</option>
<option>HYDRAULIC FILTER - XJ900</option>
<option>BRAKE PAD SET - INDUSTRIAL</option>
</select>
</div>
<div class="col-span-3 bg-surface-container-lowest p-4 text-center">
<label class="block text-[10px] text-on-surface-variant mb-1 font-bold">QTY</label>
<div class="flex items-center justify-center gap-4">
<button class="material-symbols-outlined text-outline hover:text-primary transition-colors">remove</button>
<span class="font-headline font-bold text-lg">12</span>
<button class="material-symbols-outlined text-outline hover:text-primary transition-colors">add</button>
</div>
</div>
<button class="col-span-1 bg-surface-container-high flex items-center justify-center text-error/60 hover:text-error hover:bg-error-container/20 transition-all">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Photo Upload & Actions -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="md:col-span-1">
<button class="w-full aspect-square bg-surface-container-high flex flex-col items-center justify-center gap-4 border-2 border-dashed border-outline-variant/30 hover:border-primary-container/50 hover:bg-surface-container-highest transition-all group">
<span class="material-symbols-outlined text-5xl text-on-surface-variant group-hover:text-primary-container">add_a_photo</span>
<span class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant group-hover:text-primary">Attach Photo Evidence</span>
</button>
</div>
<div class="md:col-span-2 space-y-4">
<div class="bg-surface-container-low p-4 h-full">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2 block">Maintenance Remarks</label>
<textarea class="bg-surface-container-lowest w-full h-32 p-4 text-on-surface border-none resize-none placeholder:text-surface-container-highest" placeholder="DESCRIBE WORK PERFORMED..."></textarea>
</div>
</div>
</div>
<!-- Final Action -->
<button class="w-full h-20 bg-gradient-to-br from-[#FFD700] to-[#E9C400] text-on-primary font-headline font-black text-xl tracking-[0.2em] uppercase active:scale-[0.99] transition-all flex items-center justify-center gap-4 shadow-[0_10px_30px_rgba(255,215,0,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
                SUBMIT LOG TO COMMAND
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full flex justify-around items-stretch overflow-hidden bg-[#131313]/80 backdrop-blur-xl z-50 h-20 shadow-[0_-10px_40px_rgba(0,0,0,0.6)]">
<a class="flex flex-col items-center justify-center text-[#D0C6AB] h-full w-full hover:bg-[#2A2A2A] transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined">barcode_scanner</span>
<span class="font-['Inter'] font-bold text-xs tracking-widest mt-1">SCAN</span>
</a>
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#FFD700] to-[#E9C400] text-black h-full w-full active:brightness-125 transition-all" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-['Inter'] font-bold text-xs tracking-widest mt-1">HISTORY</span>
</a>
<a class="flex flex-col items-center justify-center text-[#D0C6AB] h-full w-full hover:bg-[#2A2A2A] transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-['Inter'] font-bold text-xs tracking-widest mt-1">INVENTORY</span>
</a>
</nav>
</body></html>
