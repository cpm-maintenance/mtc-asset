name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Lint
        run: npm run lint -- --max-warnings=9999

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Coverage (ratchet baseline)
        run: npm run test:coverage

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-mtc-asset.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://demo-mtc-asset.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: demo-mtc-asset
          VITE_FIREBASE_STORAGE_BUCKET: demo-mtc-asset.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '400206066339'
          VITE_FIREBASE_APP_ID: 1:400206066339:web:demo
          VITE_FIREBASE_MEASUREMENT_ID: G-DEMO

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # firebase-tools 15 butuh JDK 21+; runner ubuntu-latest masih Java 17 →
      # emulator mati seketika ("no longer supports Java version before 21")
      # dan Playwright melaporkannya sebagai "webServer was not able to start".
      - name: Setup Java 21 (Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Build terpisah untuk E2E: dist-e2e dibangun dengan VITE_USE_EMULATORS=1
      # supaya src/js/db.js menyambung ke Firebase Emulator, bukan ke RTDB demo.
      # Tanpa ini, `vite preview` atas dist ber-env demo membuat login mustahil
      # diuji — akar masalah kenapa CI dulu cuma menjalankan smoke.
      - name: Build (E2E, emulator)
        run: npm run build:e2e
        env:
          VITE_USE_EMULATORS: '1'
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-mtc-asset.firebaseapp.com
          # Host databaseURL = namespace RTDB emulator (bukan projectId!). Harus
          # sama dengan namespace yang dipakai e2e/seed-emulator.mjs
          # (E2E_RTDB_NS, default 'mtc-asset-default-rtdb'). Beda namespace =
          # seed masuk ke tempat lain, aplikasi membaca kosong, tanpa error.
          VITE_FIREBASE_DATABASE_URL: https://mtc-asset-default-rtdb.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: demo-mtc-asset
          VITE_FIREBASE_STORAGE_BUCKET: demo-mtc-asset.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '400206066339'
          VITE_FIREBASE_APP_ID: 1:400206066339:web:demo
          VITE_FIREBASE_MEASUREMENT_ID: G-DEMO

      - name: E2E tests (full suite)
        # Seluruh spec: smoke + alur kritis login → dashboard → export PDF.
        # E2E_PREVIEW=1 → playwright memakai `vite preview` atas `dist-e2e`, build
        # terpisah yang dibangun dengan VITE_USE_EMULATORS=1 (step di atas).
        # `dist` biasa tidak bisa dipakai: env-nya demo, login tak pernah ke emulator.
        # Satu worker: worker paralel di server yang masih dingin membuat
        # `page.goto` menabrak timeout (terbukti lokal: 4 gagal / 1 lolos).
        env:
          E2E_PREVIEW: '1'
        run: npx playwright test --workers=1
