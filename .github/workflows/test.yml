name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Lint
        run: npm run lint -- --max-warnings=9999

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Coverage (ratchet baseline)
        run: npm run test:coverage

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-mtc-asset.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://demo-mtc-asset.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: demo-mtc-asset
          VITE_FIREBASE_STORAGE_BUCKET: demo-mtc-asset.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '400206066339'
          VITE_FIREBASE_APP_ID: 1:400206066339:web:demo
          VITE_FIREBASE_MEASUREMENT_ID: G-DEMO

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright menelan stderr webServer, jadi kegagalan start tidak terbaca.
      # Jalankan emulator langsung supaya pesan aslinya masuk ke log CI.
      - name: Diagnostik emulator
        run: |
          ls -l node_modules/.bin/ | grep -i firebase || echo "TIDAK ADA firebase di node_modules/.bin"
          npx firebase --version || true
          timeout 45 npx firebase emulators:start --only auth,database --config e2e/firebase.e2e.json --project mtc-asset > emu.log 2>&1 || true
          tail -40 emu.log
          grep -q "All emulators ready" emu.log

      - name: E2E tests (smoke)
        # Satu worker: 4 worker paralel di preview yang masih dingin membuat
        # `page.goto` menabrak timeout 30 s (terbukti lokal, 4 gagal / 1 lolos).
        run: npx playwright test e2e/smoke.spec.js --workers=1
