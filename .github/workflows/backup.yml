name: 🔄 Auto Backup Firebase Data

on:
  schedule:
    # Backup otomatis setiap hari jam 02:00 WIB (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:
    # Bisa juga dijalankan manual dari GitHub
    inputs:
      reason:
        description: 'Reason for manual backup'
        required: false
        default: 'Manual trigger'

jobs:
  backup:
    name: Backup Firebase Database
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: 📥 Backup Firebase Data
        id: backup
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: mtc-asset
        run: |
          echo "Starting backup at $(date)"
          
          # Buat folder backups
          mkdir -p backups
          
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="backups/backup-${TIMESTAMP}.json"
          
          # Backup semua node
          # ponytail: AI_Settings/Users/Settings TIDAK di-backup ke repo publik.
          # AI_Settings memuat API key -> memicu GitHub push protection.
          # Users/Settings = PII + config (repo public). Butuh storage privat bila perlu.
          NODES=("Equipment" "SpareParts" "HistoryLog" "Performance" "Stats" "ImageUploads")
          echo "{" > "$BACKUP_FILE"
          echo '  "_metadata": {' >> "$BACKUP_FILE"
          echo '    "exportedAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",' >> "$BACKUP_FILE"
          echo '    "project": "mtc-asset",' >> "$BACKUP_FILE"
          echo '    "trigger": "${{ github.event_name }}",' >> "$BACKUP_FILE"
          echo '    "workflow": "'${{ github.run_id }}'"' >> "$BACKUP_FILE"
          echo '  },' >> "$BACKUP_FILE"
          
          FIRST=true
          for NODE in "${NODES[@]}"; do
            echo "  Backing up /${NODE}..."
            echo "  \"${NODE}\": " >> "$BACKUP_FILE"
            # Capture JSON ke variabel; buang baris warning firebase-tools (bocor ke stdout
            # meski stderr sudah dibuang) supaya file tetap JSON valid.
            JSON=$(firebase database:get "/${NODE}" --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" 2>/dev/null | grep -v -E "Authenticating|deprecated|WARNING|⚠" || true)
            [ -z "$JSON" ] && JSON="{}"
            printf '%s' "$JSON" >> "$BACKUP_FILE"
            
            if [ "$NODE" != "${NODES[-1]}" ]; then
              echo "," >> "$BACKUP_FILE"
            fi
            echo "" >> "$BACKUP_FILE"
          done
          
          echo "}" >> "$BACKUP_FILE"
          
          # Validasi JSON — GAGALKAN step kalau invalid (cegah backup korup ter-commit)
          if command -v jq &> /dev/null; then
            if jq -e "." "$BACKUP_FILE" > /dev/null 2>&1; then
              echo "✅ Valid JSON"
            else
              echo "❌ Invalid JSON — backup dibatalkan"
              exit 1
            fi
          fi
          
          echo "✅ Backup complete: ${BACKUP_FILE}"
          echo "SIZE=$(du -h "$BACKUP_FILE" | cut -f1)" >> $GITHUB_OUTPUT

      - name: 📝 Update LATEST reference
        run: |
          echo "backup-$(date +"%Y-%m-%d_%H-%M-%S").json" > backups/LATEST.txt

      - name: 🧹 Clean old backups (keep last 30)
        run: |
          cd backups
          ls -1 backup-*.json 2>/dev/null | sort | head -n -30 | while read old; do
            echo "  Removing old backup: $old"
            rm "$old"
          done

      - name: Git Config
        run: |
          git config user.name "MTC Asset Bot"
          git config user.email "mtc-asset-bot@users.noreply.github.com"

      - name: 📤 Commit & Push Backup
        run: |
          git add backups/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "✅ No changes to backup"
          else
            git commit -m "📦 Auto backup: $(date +'%Y-%m-%d %H:%M')
            
            Automatic Firebase database backup
            Trigger: ${{ github.event_name }}
            Run ID: ${{ github.run_id }}"
            git push
            echo "✅ Backup pushed to GitHub"
          fi

      # P3-6: Kirim ringkasan backup via email (Gmail SMTP).
      # Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
      #   MAIL_USERNAME : alamat Gmail pengirim, mis. bot@gmail.com
      #   MAIL_PASSWORD : App Password Gmail (16 karakter, bukan password login)
      #   MAIL_TO       : alamat tujuan (boleh dipisah koma)
      # Kalau secrets belum di-set, step ini dilewati (tidak menggagalkan job).
      - name: 📧 Email backup summary
        if: always()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "⚠️  Mail secrets belum di-set — skip email."
            exit 0
          fi

          STATUS="${{ job.status }}"
          SIZE="${{ steps.backup.outputs.SIZE }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "From: $MAIL_USERNAME"
            echo "To: $MAIL_TO"
            echo "Subject: [MTC-Asset] Backup $STATUS - $(date +'%Y-%m-%d %H:%M')"
            echo ""
            echo "Status : $STATUS"
            echo "Trigger: ${{ github.event_name }}"
            echo "Nodes  : Equipment, SpareParts, HistoryLog, AI_Settings, ImageUploads"
            echo "Size   : ${SIZE:-n/a}"
            echo "Run ID : ${{ github.run_id }}"
            echo "Detail : $RUN_URL"
          } > /tmp/email.txt

          # Bangun daftar penerima (dukung pemisah koma).
          RCPT_ARGS=""
          for r in $(echo "$MAIL_TO" | tr ',' ' '); do
            RCPT_ARGS="$RCPT_ARGS --mail-rcpt $r"
          done

          curl --silent --show-error --url "smtps://smtp.gmail.com:465" --ssl-reqd \
            --mail-from "$MAIL_USERNAME" \
            $RCPT_ARGS \
            --user "$MAIL_USERNAME:$MAIL_PASSWORD" \
            --upload-file /tmp/email.txt

          echo "✅ Email ringkasan terkirim ke: $MAIL_TO"
