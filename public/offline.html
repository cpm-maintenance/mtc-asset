<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — MTC.ASSET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05070a;
      font-family: 'Outfit', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(251,191,36,0.04) 0%, transparent 60%);
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: rgba(7, 11, 16, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(251,191,36,0.12);
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 0 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(251,191,36,0.05);
    }
    .glow-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(168,85,247,0.08));
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      border: 1px solid rgba(251,191,36,0.12);
      box-shadow: 0 0 30px rgba(251,191,36,0.05);
    }
    .glow-icon i { font-size: 28px; color: #fbbf24; }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      text-shadow: 0 0 20px rgba(251,191,36,0.15);
    }
    .subtitle {
      font-size: 10px;
      font-weight: 700;
      color: rgba(251,191,36,0.3);
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-bottom: 20px;
    }
    p {
      font-size: 13px;
      line-height: 1.7;
      color: #64748b;
      margin-bottom: 32px;
    }
    p strong { color: #94a3b8; }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.15);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #ef4444;
      margin-bottom: 28px;
    }
    .status-dot::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(168,85,247,0.05));
      border: 1px solid rgba(251,191,36,0.15);
      border-radius: 14px;
      color: #fbbf24;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn:hover {
      background: rgba(251,191,36,0.15);
      border-color: rgba(251,191,36,0.25);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(251,191,36,0.08);
    }
    .btn-secondary {
      background: transparent;
      border-color: rgba(255,255,255,0.06);
      color: #64748b;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.1);
      color: #94a3b8;
      box-shadow: none;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 10px;
      color: #475569;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-icon">
      <i class="fas fa-wifi-slash"></i>
    </div>
    <div class="status-dot">Offline</div>
    <h1>You're Offline</h1>
    <p>
      <strong>Cached pages</strong> are still accessible.<br>
      Changes will auto-sync when connection returns.
    </p>
    <div class="actions">
      <button class="btn" onclick="window.location.reload()">
        <i class="fas fa-sync-alt"></i> Retry Connection
      </button>
      <button class="btn btn-secondary" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> Go Back
      </button>
    </div>
    <div class="footer-note">
      <i class="fas fa-database mr-1"></i> MTC.Asset Industrial Suite
    </div>
  </div>
</body>
</html>
