<!-- 👷 PAGE: TECHNICIAN WORKLOAD -->
<div x-cloak class="space-y-4">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
    <div>
      <h3 class="font-black text-xl lg:text-2xl text-orange-400 nexus-glow-text uppercase tracking-tight">Technician Workload</h3>
      <p class="text-slate-500 text-xs mt-1 font-bold uppercase tracking-widest">Weekly workload per technician</p>
    </div>
    <div class="flex flex-wrap gap-2 items-center">
      <button @click="$refs.twRefreshBtn.classList.add('animate-spin'); refreshData(); setTimeout(() => $refs.twRefreshBtn.classList.remove('animate-spin'), 1000)"
        class="w-9 h-9 rounded-xl glass flex items-center justify-center text-slate-400 hover:text-amber-400 transition-all">
        <i x-ref="twRefreshBtn" class="fas fa-sync-alt text-xs"></i>
      </button>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="glass border-nexus-accent/10 p-4 text-center border-l-2 border-cyan-500">
      <div class="text-xl md:text-2xl font-black text-cyan-500" x-text="twTechList.length"></div>
      <div class="text-[10px] text-slate-500 uppercase tracking-widest">Technicians</div>
    </div>
    <div class="glass border-nexus-accent/10 p-4 text-center border-l-2 border-blue-500">
      <div class="text-xl md:text-2xl font-black text-blue-500" x-text="twActiveWOs.length"></div>
      <div class="text-[10px] text-slate-500 uppercase tracking-widest">Active WOs</div>
    </div>
    <div class="glass border-nexus-accent/10 p-4 text-center border-l-2 border-amber-500">
      <div class="text-xl md:text-2xl font-black text-amber-500" x-text="twTotalHours.toFixed(0)"></div>
      <div class="text-[10px] text-slate-500 uppercase tracking-widest">Total Hours</div>
    </div>
    <div class="glass border-nexus-accent/10 p-4 text-center border-l-2 border-rose-500">
      <div class="text-xl md:text-2xl font-black text-rose-500" x-text="twOverloadCount"></div>
      <div class="text-[10px] text-slate-500 uppercase tracking-widest">Overload 🔴</div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="flex flex-wrap gap-3 items-center">
    <input type="text" x-model="twSearch" placeholder="Search technician..." class="w-full md:w-64 p-3 glass border-nexus-accent/10 focus:border-nexus-accent/40 text-xs font-bold">
    <input type="date" x-model="twDateFrom" class="p-3 glass border-nexus-accent/10 text-xs font-bold w-36" title="From date">
    <input type="date" x-model="twDateTo" class="p-3 glass border-nexus-accent/10 text-xs font-bold w-36" title="To date">
    <button x-show="twDateFrom || twDateTo" @click="twDateFrom=''; twDateTo=''" class="text-[11px] text-slate-500 hover:text-rose-400 font-bold uppercase tracking-widest">
      <i class="fas fa-times"></i> Clear
    </button>
    <label class="flex items-center gap-2 text-xs text-slate-500 font-bold">
      <input type="checkbox" x-model="twHideZero" class="accent-cyan-500"> Hide idle
    </label>
  </div>

  <!-- Loading -->
  <div x-show="isLoading" class="space-y-3">
    <template x-for="i in 3" :key="i">
      <div class="skeleton skeleton-card p-4 space-y-3">
        <div class="skeleton skeleton-line skeleton-md" style="width:30%"></div>
        <div class="skeleton skeleton-line skeleton-sm" style="width:60%"></div>
        <div class="skeleton skeleton-line skeleton-xs" style="width:40%"></div>
      </div>
    </template>
  </div>

  <!-- Technician Cards -->
  <div x-show="!isLoading" class="space-y-4">
    <template x-for="tech in twFilteredTechs" :key="'tw-' + tech.name">
      <div class="glass border-nexus-accent/10 rounded-2xl overflow-hidden"
        :class="tech.totalHours > 40 ? 'border-l-4 border-l-rose-500' : tech.totalHours > 30 ? 'border-l-4 border-l-amber-500' : 'border-l-4 border-l-emerald-500'">
        <!-- Header -->
        <div class="p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg"
              :class="tech.totalHours > 40 ? 'bg-rose-500/20 text-rose-400' : tech.totalHours > 30 ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'">
              <i class="fas fa-user-hard-hat"></i>
            </div>
            <div>
              <h4 class="font-black text-white text-base" x-text="tech.name"></h4>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-xs text-slate-500 font-bold"><span x-text="tech.wos.length"></span> WOs</span>
                <span class="text-slate-600">·</span>
                <span class="text-xs font-bold text-cyan-400" title="Mean Time To Repair">
                  MTTR <span x-text="techMttr(tech.name)"></span>h
                </span>
                <span x-show="techBreakdowns(tech.name) > 0" class="text-slate-600">·</span>
                <span x-show="techBreakdowns(tech.name) > 0" class="text-xs font-bold text-rose-400" title="Breakdowns handled">
                  <span x-text="techBreakdowns(tech.name)"></span> bd
                </span>
                <span class="text-slate-600">·</span>
                <span class="text-xs font-bold" :class="tech.totalHours > 40 ? 'text-rose-400' : 'text-slate-400'">
                  <span x-text="tech.totalHours.toFixed(1)"></span> / 40 hrs
                </span>
              </div>
            </div>
          </div>
          <!-- Progress bar -->
          <div class="flex-1 max-w-xs">
            <div class="flex items-center gap-3">
              <div class="flex-1 h-2.5 rounded-full bg-slate-700/50 overflow-hidden">
                <div class="h-full rounded-full transition-all duration-500" 
                  :style="'width: ' + Math.min(100, (tech.totalHours / 40) * 100) + '%'"
                  :class="tech.totalHours > 40 ? 'bg-rose-500' : tech.totalHours > 30 ? 'bg-amber-500' : 'bg-emerald-500'"></div>
              </div>
              <span class="text-xs font-black" :class="tech.totalHours > 40 ? 'text-rose-400' : 'text-slate-400'" x-text="Math.min(100, Math.round((tech.totalHours / 40) * 100)) + '%'"></span>
            </div>
            <div x-show="tech.totalHours > 40" class="flex items-center gap-1 mt-1 text-[10px] font-black text-rose-400 uppercase tracking-widest">
              <i class="fas fa-exclamation-triangle"></i>
              <span>Overload! <span x-text="(tech.totalHours - 40).toFixed(1)"></span> hrs over limit</span>
            </div>
          </div>
        </div>

        <!-- WO List -->
        <div x-show="tech.wos.length > 0" class="border-t border-white/5">
          <div class="overflow-x-auto">
            <div class="overflow-x-auto"><table class="w-full text-xs">
              <thead>
                <tr class="border-b border-white/5 text-slate-500 font-black uppercase tracking-widest">
                  <th class="text-left p-3">WO</th>
                  <th class="text-left p-3">Description</th>
                  <th class="text-left p-3 hidden md:table-cell">Equipment</th>
                  <th class="text-left p-3 hidden md:table-cell">Priority</th>
                  <th class="text-left p-3">Status</th>
                  <th class="text-right p-3">Hours</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/5">
                <template x-for="wo in tech.wos" :key="wo.LogID">
                  <tr class="hover:bg-white/[0.02] cursor-pointer transition-all" @click="planningShowDetail(wo)">
                    <td class="p-3">
                      <span x-show="wo.woNumber" class="font-mono text-purple-400 font-bold" x-text="'#'+wo.woNumber"></span>
                      <span x-show="!wo.woNumber" class="text-slate-500 italic font-bold">—</span>
                    </td>
                    <td class="p-3 font-bold text-white max-w-[200px] truncate" x-text="wo.Deskripsi || wo.Jenis || '-'"></td>
                    <td class="p-3 text-slate-400 hidden md:table-cell" x-text="planningEquipName(wo.EquipmentID) || wo.EquipmentID || '—'"></td>
                    <td class="p-3 hidden md:table-cell">
                      <span class="px-2 py-0.5 rounded font-bold uppercase text-[9px]" :class="planningPriorityColor(wo.woPriority || 'Normal')" x-text="wo.woPriority || 'Normal'"></span>
                    </td>
                    <td class="p-3">
                      <span class="px-2 py-0.5 rounded font-bold uppercase text-[9px]" :class="logStatusColor(wo.Status)" x-text="wo.Status"></span>
                    </td>
                    <td class="p-3 text-right font-bold" x-text="wo.estimatedHours || 0"></td>
                  </tr>
                </template>
              </tbody>
              <tfoot>
                <tr class="border-t border-white/10 bg-slate-800/30">
                  <td colspan="5" class="p-3 text-xs font-black text-slate-500 uppercase tracking-widest text-right">Total</td>
                  <td class="p-3 text-right font-black text-white" x-text="tech.totalHours.toFixed(1)"></td>
                </tr>
              </tfoot>
            </table></div>
          </div>
        </div>
        <div x-show="tech.wos.length === 0" class="p-6 text-center text-slate-600">
          <i class="fas fa-user-check text-xl mb-2 block"></i>
          <p class="text-xs font-bold">No WOs assigned in this period</p>
        </div>
      </div>
    </template>

    <!-- Empty -->
    <div x-show="twFilteredTechs.length === 0" class="text-center py-16">
      <i class="fas fa-users text-5xl text-slate-700 mb-4 block"></i>
      <p class="text-slate-400 text-lg font-bold">No data</p>
      <p class="text-slate-500 text-sm mt-2">Assign WOs to technicians to see workload</p>
    </div>
  </div>
</div>
