<!-- ═══ PAGE: MTC AI — ANALYSIS NODE (Tactical Slate) ═══ -->
<div x-cloak class="w-full flex flex-col gap-space-md pb-12">

  <!-- ═══ 1. COMMAND BANNER / HEADER BAR ═══════════════════════════════════ -->
  <header class="flex flex-col md:flex-row md:items-center justify-between gap-space-sm border-b border-tac-border-subtle pb-space-sm">
    <div>
      <div class="flex items-center gap-space-xs font-label-mono-sm text-label-mono-sm text-tac-status-standby">
        <span class="inline-block w-2 h-2 rounded-full bg-tac-sync-cyan animate-pulse"></span>
        <span class="text-tac-on-surface font-semibold">MTC AI NODE · DIAGNOSTIC CORE</span>
      </div>
      <div class="flex items-center gap-space-sm mt-0.5 flex-wrap">
        <h1 class="font-headline-lg text-headline-lg text-tac-on-surface uppercase tracking-tight">AI Analysis</h1>
        <span x-show="aiIsAnalyzing || isAnalyzing"
          class="px-2 py-0.5 rounded-full bg-tac-sync-cyan/15 text-tac-sync-cyan font-label-mono-sm text-label-mono-sm font-semibold animate-pulse">
          PROCESSING…
        </span>
      </div>
    </div>

    <div class="flex items-center gap-space-sm flex-wrap">
      <button type="button" @click="showAPISettings = true"
        class="flex items-center gap-1.5 px-space-md py-2 rounded bg-tac-surface-container-high hover:bg-tac-surface-elevated text-tac-on-surface font-label-mono-md text-label-mono-md shadow-sm transition-all active:scale-95">
        <span class="material-symbols-outlined text-[16px] text-tac-primary">settings</span>
        <span class="hidden sm:inline">SETTINGS</span>
      </button>
    </div>
  </header>

  <!-- ═══ 2. NODE TELEMETRY DECK (4 KARTU) ═════════════════════════════════ -->
  <section aria-label="KPI node AI" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-space-md">

    <!-- KPI 1 — Model -->
    <div class="bg-tac-surface-card rounded-lg p-space-md shadow-[12px_16px_28px_rgba(0,0,0,0.5),-4px_-4px_14px_rgba(255,255,255,0.03)] flex flex-col justify-between">
      <div class="flex items-center justify-between">
        <span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider text-tac-status-standby">Active Model</span>
        <span class="p-1 rounded bg-tac-surface-container text-tac-sync-cyan">
          <span class="material-symbols-outlined text-[18px]">neurology</span>
        </span>
      </div>
      <div class="mt-space-sm flex items-baseline gap-2">
        <span class="font-headline-md text-headline-md font-bold text-tac-sync-cyan truncate" x-text="aiModel || 'NOT SET'"></span>
      </div>
      <div class="mt-space-xs pt-2 border-t border-tac-border-subtle flex items-center justify-between font-label-mono-sm text-label-mono-sm">
        <span class="text-tac-status-standby">OPSI MODEL</span>
        <span class="text-tac-on-surface font-semibold" x-text="(aiModelOptions ? aiModelOptions.length : 0) + ' PILIHAN'"></span>
      </div>
    </div>

    <!-- KPI 2 — Provider -->
    <div class="bg-tac-surface-card rounded-lg p-space-md shadow-[12px_16px_28px_rgba(0,0,0,0.5),-4px_-4px_14px_rgba(255,255,255,0.03)] flex flex-col justify-between">
      <div class="flex items-center justify-between">
        <span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider text-tac-status-standby">Provider</span>
        <span class="p-1 rounded bg-tac-surface-container text-tac-primary">
          <span class="material-symbols-outlined text-[18px]">public</span>
        </span>
      </div>
      <div class="mt-space-sm flex items-baseline gap-2">
        <span class="font-headline-md text-headline-md font-bold text-tac-primary uppercase" x-text="aiProvider || 'NOT SET'"></span>
      </div>
      <div class="mt-space-xs pt-2 border-t border-tac-border-subtle flex items-center justify-between font-label-mono-sm text-label-mono-sm">
        <span class="text-tac-status-standby">API KEY</span>
        <span :class="aiApiKeys.length > 0 ? 'text-tac-status-operational font-semibold' : 'text-tac-status-emergency font-semibold'"
          x-text="aiApiKeys.length > 0 ? 'TERKONFIGURASI' : 'BELUM ADA'"></span>
      </div>
    </div>

    <!-- KPI 3 — Analysis -->
    <div class="bg-tac-surface-card rounded-lg p-space-md shadow-[12px_16px_28px_rgba(0,0,0,0.5),-4px_-4px_14px_rgba(255,255,255,0.03)] flex flex-col justify-between">
      <div class="flex items-center justify-between">
        <span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider text-tac-status-standby">Analysis Output</span>
        <span class="p-1 rounded bg-tac-surface-container text-tac-status-operational">
          <span class="material-symbols-outlined text-[18px]">psychology</span>
        </span>
      </div>
      <div class="mt-space-sm flex items-baseline gap-2">
        <span class="font-headline-md text-headline-md font-bold"
          :class="analysisResult ? 'text-tac-status-operational' : 'text-tac-status-standby'"
          x-text="analysisResult ? 'READY' : 'EMPTY'"></span>
      </div>
      <div class="mt-space-xs pt-2 border-t border-tac-border-subtle flex items-center justify-between font-label-mono-sm text-label-mono-sm">
        <span class="text-tac-status-standby">PANJANG OUTPUT</span>
        <span class="text-tac-on-surface font-semibold" x-text="(analysisResult ? analysisResult.length : 0) + ' CHAR'"></span>
      </div>
    </div>

    <!-- KPI 4 — Chat -->
    <div class="bg-tac-surface-card rounded-lg p-space-md shadow-[12px_16px_28px_rgba(0,0,0,0.5),-4px_-4px_14px_rgba(255,255,255,0.03)] flex flex-col justify-between">
      <div class="flex items-center justify-between">
        <span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider text-tac-status-standby">Chat Turns</span>
        <span class="p-1 rounded bg-tac-surface-container text-tac-gold-bright">
          <span class="material-symbols-outlined text-[18px]">smart_toy</span>
        </span>
      </div>
      <div class="mt-space-sm flex items-baseline gap-2">
        <span class="font-headline-lg text-headline-lg font-bold text-tac-gold-bright" x-text="aiChatHistory.length"></span>
        <span class="font-label-mono-sm text-label-mono-sm text-tac-status-standby">PESAN</span>
      </div>
      <div class="mt-space-xs pt-2 border-t border-tac-border-subtle flex items-center justify-between font-label-mono-sm text-label-mono-sm">
        <span class="text-tac-status-standby">STATUS</span>
        <span :class="aiIsAnalyzing ? 'text-tac-sync-cyan font-semibold' : 'text-tac-on-surface font-semibold'"
          x-text="aiIsAnalyzing ? 'BERPIKIR…' : 'IDLE'"></span>
      </div>
    </div>

  </section>

  <!-- ═══ 3. AI ACTION DECK ════════════════════════════════════════════════ -->
  <section aria-label="Aksi AI" class="grid grid-cols-1 md:grid-cols-3 gap-space-md">

    <button type="button" @click="analyzeKPI()" :disabled="isAnalyzing"
      class="text-left bg-tac-surface-card rounded-lg border border-tac-border-subtle p-space-md hover:bg-tac-surface-elevated/60 hover:border-tac-sync-cyan/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.99]">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded bg-tac-sync-cyan/15 border border-tac-sync-cyan/30 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[22px] text-tac-sync-cyan">psychology</span>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="font-headline-md text-headline-md font-bold text-tac-on-surface">Analyze KPI</h2>
          <p class="font-body-sm text-body-sm text-tac-on-surface-variant">Insight otomatis dari data KPI</p>
        </div>
        <span class="material-symbols-outlined text-[18px] text-tac-status-standby">chevron_right</span>
      </div>
    </button>

    <button type="button" @click="getAIRecommendations()" :disabled="isAnalyzing"
      class="text-left bg-tac-surface-card rounded-lg border border-tac-border-subtle p-space-md hover:bg-tac-surface-elevated/60 hover:border-tac-status-repair/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.99]">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded bg-tac-status-repair/15 border border-tac-status-repair/30 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[22px] text-tac-status-repair">lightbulb</span>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="font-headline-md text-headline-md font-bold text-tac-on-surface">Rekomendasi</h2>
          <p class="font-body-sm text-body-sm text-tac-on-surface-variant">Usulan Work Order berbasis AI</p>
        </div>
        <span class="material-symbols-outlined text-[18px] text-tac-status-standby">chevron_right</span>
      </div>
    </button>

    <button type="button" @click="generatePPT()" :disabled="!analysisResult || isGenerating"
      class="text-left bg-tac-surface-card rounded-lg border border-tac-border-subtle p-space-md hover:bg-tac-surface-elevated/60 hover:border-tac-status-operational/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.99]">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded bg-tac-status-operational/15 border border-tac-status-operational/30 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[22px] text-tac-status-operational">description</span>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="font-headline-md text-headline-md font-bold text-tac-on-surface">Generate PPT</h2>
          <p class="font-body-sm text-body-sm text-tac-on-surface-variant" x-text="analysisResult ? 'Ekspor laporan presentasi' : 'Butuh hasil analisis dulu'"></p>
        </div>
        <span class="material-symbols-outlined text-[18px] text-tac-status-standby">chevron_right</span>
      </div>
    </button>

  </section>

  <!-- ═══ 4. ANALYSIS OUTPUT ═══════════════════════════════════════════════ -->
  <section x-show="analysisResult" class="bg-tac-surface-card rounded-lg border border-tac-border-subtle overflow-hidden">
    <div class="flex items-center justify-between gap-space-sm px-3 py-2 border-b border-tac-border-subtle bg-tac-surface-recessed">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-tac-status-operational text-[18px]">lightbulb</span>
        <h2 class="font-label-mono-md text-label-mono-md font-bold uppercase text-tac-on-surface">AI Analysis Result</h2>
      </div>
      <span class="font-label-mono-sm text-label-mono-sm text-tac-status-standby"
        x-text="(analysisResult ? analysisResult.length : 0) + ' CHAR'"></span>
    </div>
    <div class="p-space-md bg-tac-surface-recessed/60 font-body-sm text-body-sm text-tac-on-surface whitespace-pre-wrap leading-relaxed"
      x-text="analysisResult"></div>
  </section>

  <!-- ═══ 5. AI CHAT CONSOLE ═══════════════════════════════════════════════ -->
  <section class="bg-tac-surface-card rounded-lg border border-tac-border-subtle overflow-hidden">
    <div class="flex items-center justify-between gap-space-sm px-3 py-2 border-b border-tac-border-subtle bg-tac-surface-recessed">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-tac-gold-bright text-[18px]">smart_toy</span>
        <h2 class="font-label-mono-md text-label-mono-md font-bold uppercase text-tac-on-surface">Tanya AI</h2>
      </div>
      <button type="button" x-show="aiChatHistory.length > 0" @click="clearAIChat()"
        class="flex items-center gap-1.5 font-label-mono-sm text-label-mono-sm text-tac-status-standby hover:text-tac-status-emergency transition-colors">
        <span class="material-symbols-outlined text-[14px]">close</span>
        <span>BERSIHKAN</span>
      </button>
    </div>

    <div class="p-space-md flex flex-col gap-space-sm">
      <!-- Transcript -->
      <div x-show="aiChatHistory.length > 0" class="flex flex-col gap-2 max-h-80 overflow-y-auto pr-1">
        <template x-for="(msg, idx) in aiChatHistory" :key="idx">
          <div class="flex flex-col gap-1 max-w-[85%] p-3 rounded-lg border"
            :class="msg.role === 'user' ? 'ml-auto bg-tac-primary/10 border-tac-primary/25' : 'mr-auto bg-tac-surface-recessed border-tac-border-subtle'">
            <div class="flex items-center gap-1.5 font-label-mono-sm text-label-mono-sm text-tac-status-standby uppercase">
              <span class="material-symbols-outlined text-[13px]"
                x-text="msg.role === 'user' ? 'person' : 'smart_toy'"></span>
              <span x-text="msg.role === 'user' ? 'ANDA' : 'MTC AI'"></span>
            </div>
            <div class="font-body-sm text-body-sm text-tac-on-surface whitespace-pre-wrap" x-text="msg.text"></div>
          </div>
        </template>
      </div>

      <!-- Thinking -->
      <div x-show="aiIsAnalyzing" class="flex items-center gap-2 font-label-mono-sm text-label-mono-sm text-tac-sync-cyan">
        <span class="material-symbols-outlined text-[16px] animate-spin">sync</span>
        <span>MTC AI SEDANG BERPIKIR…</span>
      </div>

      <!-- Composer -->
      <div class="flex items-center gap-2">
        <div class="flex-1 relative flex items-center bg-tac-surface-recessed rounded px-space-sm py-2 shadow-[inset_2px_2px_5px_rgba(0,0,0,0.6),inset_-1px_-1px_3px_rgba(255,255,255,0.04)]">
          <span class="material-symbols-outlined text-tac-status-standby text-[18px] mr-2">search</span>
          <label for="ai-chat-input" class="sr-only">Pertanyaan untuk MTC AI</label>
          <input id="ai-chat-input" type="text" x-model="aiChatInput" @keyup.enter="sendAIChat()" placeholder="Tulis pertanyaan…"
            class="w-full bg-transparent text-tac-on-surface font-body-sm text-body-sm outline-none placeholder:text-tac-status-standby">
        </div>
        <button type="button" @click="sendAIChat()" :disabled="aiIsAnalyzing || !aiChatInput"
          class="flex items-center gap-1.5 px-space-md py-2 rounded bg-tac-primary-container text-tac-on-primary-container font-label-mono-md text-label-mono-md font-bold shadow-[0_0_16px_rgba(245,158,11,0.3)] hover:bg-tac-gold-bright transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">
          <span class="material-symbols-outlined text-[18px]">play_arrow</span>
          <span class="hidden sm:inline">KIRIM</span>
        </button>
      </div>
    </div>
  </section>

</div>
