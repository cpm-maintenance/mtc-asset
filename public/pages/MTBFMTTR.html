<!-- 📊 PAGE: MTBF/MTTR AUTO TRENDING -->
<div x-cloak class="space-y-4">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
    <div>
      <h3 class="font-black text-xl lg:text-2xl text-cyan-400 nexus-glow-text uppercase tracking-tight">MTBF / MTTR</h3>
      <p class="text-slate-500 text-xs mt-1 font-bold uppercase tracking-widest">Reliability &amp; Maintainability Trends</p>
    </div>
    <div class="flex items-center gap-2">
      <button @click="mtbfRefresh()" class="w-9 h-9 rounded-xl glass flex items-center justify-center text-slate-400 hover:text-amber-400 transition-all">
        <i class="fas fa-sync-alt text-xs"></i>
      </button>
    </div>
  </div>

  <!-- Filter -->
  <div class="glass border-nexus-accent/10 p-4 rounded-2xl">
    <div class="flex flex-wrap items-end gap-4">
      <div class="w-full md:w-72">
        <label class="text-[9px] text-slate-500 uppercase font-black tracking-widest block mb-2">Equipment</label>
        <select x-model="mtbfFilterEquip" @change="renderMTBFMTTRChart()" class="w-full p-3 glass border-nexus-accent/10 text-xs font-bold">
          <option value="">-- Select Equipment --</option>
          <template x-for="eq in equipment" :key="eq.EquipmentID">
            <option :value="eq.EquipmentID" x-text="eq.EquipmentID + ' - ' + (eq.Nama || '')"></option>
          </template>
        </select>
      </div>
      <div x-show="mtbfFilterEquip" class="flex gap-2">
        <div class="glass p-3 rounded-xl">
          <span class="text-[9px] text-slate-500 block uppercase font-black tracking-widest">MTBF</span>
          <span class="text-lg font-black text-cyan-400" x-text="(mtbfResult?.mtbfDays || 0) + ' days'"></span>
        </div>
        <div class="glass p-3 rounded-xl">
          <span class="text-[9px] text-slate-500 block uppercase font-black tracking-widest">MTTR</span>
          <span class="text-lg font-black text-amber-400" x-text="(mtbfResult?.mttrHours || 0) + ' hrs'"></span>
        </div>
        <div class="glass p-3 rounded-xl">
          <span class="text-[9px] text-slate-500 block uppercase font-black tracking-widest">Events</span>
          <span class="text-lg font-black text-white" x-text="mtbfResult?.totalEvents || 0"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div x-show="mtbfFilterEquip" class="glass border-nexus-accent/10 rounded-2xl p-4">
    <div class="h-80">
      <canvas id="mtbfChart"></canvas>
    </div>
    <p class="text-[9px] text-slate-600 text-center mt-2 uppercase font-black tracking-widest">6-Month Rolling MTBF (days) / MTTR (hours) Trend</p>
  </div>

  <!-- Empty -->
  <div x-show="!mtbfFilterEquip" class="text-center py-16">
    <i class="fas fa-chart-line text-5xl text-slate-700 mb-4 block"></i>
    <p class="text-slate-400 text-lg font-bold">Select Equipment</p>
    <p class="text-slate-500 text-sm mt-2">Choose equipment to view MTBF/MTTR reliability trends</p>
  </div>
</div>
